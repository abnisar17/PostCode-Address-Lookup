# =============================================================
# Host nginx reverse proxy — HTTPS (production)
# Mirrors the live certbot-managed config on the server, plus
# security headers. Terminates TLS and proxies to the dockerized
# frontend (3000) and backend (8000).
#
# Cert + the two SSL include files below are managed by certbot
# (nginx plugin) and auto-renewed via certbot-renew.timer +
# /etc/cron.d/certbot-renew. The include/ssl_dhparam paths exist
# only after certbot has issued a cert — deploy.sh installs this
# file only when that cert is present.
# =============================================================

# ── HTTPS :443 — TLS termination + reverse proxy ──────────────
server {
    server_name getaddress.etakeawaymax.co.uk;

    client_max_body_size 10m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Frontend (including JS/CSS/assets)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/getaddress.etakeawaymax.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getaddress.etakeawaymax.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTP :80 — ACME challenges + redirect to HTTPS ────────────
server {
    listen 80;
    server_name getaddress.etakeawaymax.co.uk;

    # Let's Encrypt HTTP-01 webroot challenge (fallback path).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    if ($host = getaddress.etakeawaymax.co.uk) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
