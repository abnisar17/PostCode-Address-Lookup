# =============================================================
# Host nginx reverse proxy — HTTPS (production)
# Used by deploy.sh once a Let's Encrypt cert exists for the domain.
# Terminates TLS and proxies to the dockerized frontend (3000) and
# backend (8000). Redirects all plain HTTP to HTTPS.
#
# Cert is managed by certbot (nginx plugin) and auto-renewed via
# certbot-renew.timer + /etc/cron.d/certbot-renew.
# =============================================================

# ── HTTP :80 — ACME challenges + redirect everything to HTTPS ──
server {
    listen 80;
    server_name getaddress.etakeawaymax.co.uk;

    # Let's Encrypt HTTP-01 webroot challenge (fallback path).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — TLS termination + reverse proxy ──────────────
server {
    listen 443 ssl http2;
    server_name getaddress.etakeawaymax.co.uk;

    ssl_certificate     /etc/letsencrypt/live/getaddress.etakeawaymax.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getaddress.etakeawaymax.co.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (everything else)
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
