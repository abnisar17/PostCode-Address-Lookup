# ============================================================================
# Browser API-key injection (host nginx, http context).
#
# Lets the public website call /api WITHOUT shipping a key in its JS bundle:
#   1. If the caller already sent an X-API-Key header (server-to-server
#      consumers), it is passed through unchanged.
#   2. Otherwise, if the request's Referer is our own site, nginx injects the
#      website key.
#   3. Otherwise no key is sent and the backend returns 401.
#
# Install: place this file at /etc/nginx/conf.d/api-key-inject.conf (it is
# included at the http level via conf.d/*.conf), replace the placeholder with
# the real website key, and add this line inside the HTTPS server's
# `location /api/` block:
#       proxy_set_header X-API-Key $api_key_final;
#
# NOTE: the website key lives only here (server-side) and in the database —
# never in the browser bundle. Referer can be spoofed by non-browser clients,
# which is an accepted trade-off for public, read-only data.
# ============================================================================

# Website key when the request comes from our own pages (Referer match).
map $http_referer $api_key_from_referer {
    default "";
    "~*^https://getaddress\.etakeawaymax\.co\.uk(/|$)" "REPLACE_WITH_WEBSITE_KEY";
}

# A caller-supplied key wins; otherwise fall back to the Referer-based key.
map $http_x_api_key $api_key_final {
    default $http_x_api_key;
    ""      $api_key_from_referer;
}
