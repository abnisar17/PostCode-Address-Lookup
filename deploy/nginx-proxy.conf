# HTTP-only bootstrap proxy. Used by deploy.sh on a fresh server BEFORE a
# TLS cert has been issued. Once certbot has a cert for the domain, deploy.sh
# installs deploy/nginx-proxy-tls.conf instead (HTTPS + redirect).
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Let's Encrypt HTTP-01 webroot challenge (so certbot can issue the cert).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (everything else)
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
